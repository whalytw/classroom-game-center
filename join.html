<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>加入遊戲｜Classroom Game Center</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="controller-page">
  <div class="controller-shell">
    <section class="card controller-card">
      <div class="eyebrow">Classroom Game Center</div>
      <h1 id="pageTitle">加入遊戲房間</h1>
      <div id="status" class="notice info">正在驗證房間通行證…</div>

      <div id="roomInfo" class="hidden">
        <div class="controller-room-meta">
          <strong id="gameName"></strong>
          <span>房間 <b id="roomCode"></b></span>
          <span id="timeInfo" class="muted"></span>
        </div>

        <div id="seatBox" class="hidden seat-box">
          <label for="seat">座號</label>
          <input id="seat" type="number" min="1" max="99" inputmode="numeric" placeholder="例如 12">
          <button id="continueBtn" class="btn primary controller-wide-btn">加入遊戲</button>
        </div>

        <div id="controller" class="hidden">
          <div class="controller-score-row">
            <div><span>座號</span><strong id="seatLabel">—</strong></div>
            <div><span>分數</span><strong id="scoreLabel">0</strong></div>
            <div><span>剩餘</span><strong id="timeLabel">60</strong></div>
          </div>

          <div id="gameMessage" class="notice info">等待老師開始遊戲。</div>

          <div class="grip-mode-bar" aria-label="手機握持方式">
            <div class="grip-mode-group">
              <span class="grip-label">手機握持</span>
              <div class="segmented-control">
                <button id="portraitModeBtn" type="button" class="segment-btn active" aria-pressed="true">直式</button>
                <button id="landscapeModeBtn" type="button" class="segment-btn" aria-pressed="false">橫式</button>
              </div>
            </div>
            <div id="fireSideChooser" class="grip-mode-group hidden">
              <span class="grip-label">FIRE 位置</span>
              <div class="segmented-control">
                <button id="fireLeftBtn" type="button" class="segment-btn" aria-pressed="false">左側</button>
                <button id="fireRightBtn" type="button" class="segment-btn active" aria-pressed="true">右側</button>
              </div>
            </div>
          </div>

          <div id="controllerCore" class="controller-core portrait-layout fire-right">
            <div class="aim-section">
              <div class="aim-title-row">
                <strong>瞄準控制</strong>
                <button id="centerBtn" class="btn ghost small-btn">準星置中</button>
              </div>
              <div id="aimPad" class="aim-pad" aria-label="拖曳控制準星">
                <div id="aimDot" class="aim-dot"></div>
                <div class="aim-hint">在此拖曳準星<br><small>請看前方大螢幕瞄準</small></div>
              </div>
            </div>

            <button id="fireBtn" class="fire-btn" disabled>
              <span>FIRE</span>
              <small id="cooldownLabel">等待遊戲</small>
            </button>
          </div>

          <div class="tilt-controls sensor-panel">
            <button id="tiltBtn" class="btn ghost">啟用光線槍感應</button>
            <div class="sensor-options">
              <label class="tilt-option">
                <input id="invertXToggle" type="checkbox">
                <span>左右反轉</span>
              </label>
              <label class="tilt-option">
                <input id="invertYToggle" type="checkbox">
                <span>上下反轉</span>
              </label>
            </div>
            <button id="recenterTiltBtn" class="btn ghost small-btn" disabled>重新校正感應</button>
          </div>
          <div id="controllerHint" class="muted controller-hint">每次射擊至少間隔 1 秒。可使用拖曳瞄準，或啟用光線槍感應後用手機左右旋轉、上下抬壓來瞄準。</div>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="./join.js"></script>
</body>
</html>
